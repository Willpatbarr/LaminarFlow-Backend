# Deployed stack: the app and its database.
#
# Kept separate from the repository-root docker-compose.yml, which starts only
# Postgres for local development. Merging the two would mean a developer running
# `docker compose up` accidentally starts a server, and an operator reading this
# file wading through dev-only settings.
#
# Nothing here names a specific host. Every value that differs between the Pi,
# the home server, and a cloud VM comes from the environment - see
# deploy/.env.example and docs/deploy.md.

services:
  app:
    image: ${APP_IMAGE:-laminarflow:dev}
    restart: unless-stopped
    depends_on:
      db:
        # Waits for the healthcheck, not just for the container to exist. The
        # server refuses to start against a database it cannot reach, so
        # starting it first would just crash-loop until Postgres caught up.
        condition: service_healthy
    environment:
      # db is the compose service name, resolved on the compose network. This is
      # the one value that genuinely differs from a developer's .env, where the
      # database is on localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-laminarflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-laminarflow}?sslmode=disable
      PORT: ${APP_PORT:-8080}
      # On by default here and only here: an operator upgrading by pulling a new
      # image expects the schema to follow. The binary still defaults to off, so
      # nothing else inherits this.
      MIGRATE_ON_STARTUP: ${MIGRATE_ON_STARTUP:-true}
    ports:
      # Bound to the tailnet interface by default rather than 0.0.0.0, so a
      # misconfigured firewall does not silently expose this to a LAN. Set
      # APP_BIND=0.0.0.0 deliberately if that is what you want.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:${APP_PORT:-8080}"
    mem_limit: 256m

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laminarflow}
      POSTGRES_USER: ${POSTGRES_USER:-laminarflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # Host path is configurable so this works on the Pi (USB HDD), the home
      # server, and a cloud VM without edits.
      - ${PGDATA_HOST:-./pgdata}:/var/lib/postgresql/data
    # No published port. The app reaches Postgres over the compose network;
    # exposing 5432 to the host would be a database on the tailnet for no
    # reason. Use `docker compose exec db psql` when you need a shell.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c max_connections=20
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    # Silently ignored on Raspberry Pi OS unless /boot/firmware/cmdline.txt has
    # cgroup_enable=memory cgroup_memory=1 (verify with `docker info`).
    mem_limit: 512m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-laminarflow} -d ${POSTGRES_DB:-laminarflow}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
